<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SENSE Salon" />
  <link rel="apple-touch-icon" href="./IMG_9701.jpeg" />
  <link rel="icon" type="image/jpeg" href="./IMG_9701.jpeg" />
  <title>SENSE Beauty Salon — VIP Loyalty & Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #050505;
      --card: #111111;
      --card-2: #181818;
      --gold: #d4af37;
      --gold-light: #f3d98b;
      --gold-dim: rgba(212, 175, 55, 0.22);
      --border: rgba(212, 175, 55, 0.28);
      --text: #f5f5f5;
      --muted: #9e9e9e;
      --danger: #e05252;
      --success: #38b778;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #171206 0%, #050505 48%);
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
    }
    .en { font-family: 'Playfair Display', serif; letter-spacing: 0.6px; }
    .container { max-width: 480px; margin: 0 auto; padding: 16px; }

    .logo-wrap {
      background: #000000;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 28px rgba(212, 175, 55, 0.16);
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(5, 5, 5, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    }
    .topbar-inner {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand-mini { display: flex; align-items: center; gap: 10px; }
    .brand-mini .logo-wrap { width: 42px; height: 42px; flex-shrink: 0; }
    .brand-title { font-size: 15px; font-weight: 800; color: var(--gold-light); line-height: 1.2; }
    .brand-sub { font-size: 11px; color: var(--muted); }
    .icon-btn {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--gold-light);
      border-radius: 12px;
      padding: 8px 11px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .card {
      background: linear-gradient(160deg, #141414 0%, #0b0b0b 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    }
    .gold-text {
      background: linear-gradient(90deg, #d4af37, #f8e59d, #c59b27);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    label { display: block; font-size: 12px; color: var(--gold-light); margin-bottom: 6px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      margin-bottom: 12px;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-dim); }
    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-gold {
      background: linear-gradient(135deg, #b88a1e 0%, #f1d47b 50%, #c89b2b 100%);
      color: #080808;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--gold-light);
    }
    .btn-success { background: var(--success); color: #05140c; }
    .btn-danger { background: rgba(224, 82, 82, 0.15); border: 1px solid var(--danger); color: #ff8e8e; }

    .stamps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 16px 0;
    }
    .stamp-slot {
      aspect-ratio: 1;
      border-radius: 16px;
      border: 1.5px dashed rgba(212, 175, 55, 0.35);
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.25s ease;
    }
    .stamp-slot.filled {
      border-style: solid;
      border-color: var(--gold);
      background: radial-gradient(circle, rgba(212, 175, 55, 0.24) 0%, #0e0c05 100%);
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.22);
    }
    .stamp-num { font-size: 12px; color: var(--muted); font-weight: 700; }
    .stamp-icon { font-size: 26px; line-height: 1; margin-bottom: 4px; }
    .reward-banner {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.16), rgba(212, 175, 55, 0.04));
      border: 1px solid var(--gold);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      font-size: 13px;
      color: var(--gold-light);
      font-weight: 700;
    }
    .reward-ready {
      background: linear-gradient(135deg, #b88a1e, #f1d47b);
      color: #050505;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.5); }
      50% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
    }

    .qr-box {
      background: #ffffff;
      padding: 12px;
      border-radius: 16px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin: 8px auto;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 35;
      background: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 4px 12px;
    }
    .nav-item.active { color: var(--gold-light); }
    .nav-item span.ico { font-size: 19px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0d0d0d;
      color: #ddd;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .chip.selected {
      background: var(--gold);
      color: #050505;
      font-weight: 800;
      border-color: var(--gold);
    }
    .list-item {
      background: #0d0d0d;
      border: 1px solid rgba(212, 175, 55, 0.18);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .b-pending { background: rgba(212, 175, 55, 0.2); color: var(--gold-light); }
    .b-confirmed { background: rgba(56, 183, 120, 0.2); color: #6be3a4; }
    .b-cancelled { background: rgba(224, 82, 82, 0.2); color: #ff9a9a; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      background: #111;
      border-top: 1.5px solid var(--gold);
      border-radius: 24px 24px 0 0;
      padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
    }
    .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat-box { background: #0a0a0a; border: 1px solid var(--border); border-radius: 14px; padding: 12px; text-align: center; }
    .stat-val { font-size: 22px; font-weight: 800; color: var(--gold-light); }
    .stat-lbl { font-size: 11px; color: var(--muted); }
    .hidden { display: none !important; }
    .toast {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      border: 1px solid var(--gold);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      z-index: 90;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
      display: none;
      max-width: 92%;
      text-align: center;
      word-break: break-word;
    }
  </style>
</head>
<body>

<div id="toast" class="toast"></div>

<header id="appHeader" class="topbar hidden">
  <div class="topbar-inner">
    <div class="brand-mini">
      <div class="logo-wrap">
        <img src="./IMG_9701.jpeg" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/hatmhamed867-cell/sense-salon/main/IMG_9701.jpeg'" alt="SENSE Beauty Salon
